```html
<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlRoot">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#021310">
<title>أَثَر | Athar — رفيقك الروحي والقرآني الشامل</title>

<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg-primary: #021310;
  --emerald-main: #059669;
  --emerald-dark: #047857;
  --glass-card: rgba(3, 31, 24, 0.95);
  --glass-border: rgba(16, 185, 129, 0.25);
  --text-light: #f0fdf4;
  --text-muted: #a7f3d0;
  --shadow-card: 0 16px 36px -10px rgba(0, 0, 0, 0.7);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

body {
  margin: 0;
  background-color: #021310;
  color: var(--text-light);
  font-family: 'Cairo', sans-serif;
  padding-bottom: 130px;
  min-height: 100vh;
}

.glass-card {
  background: var(--glass-card);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid var(--glass-border);
  border-radius: 20px;
  padding: 16px;
  margin-bottom: 12px;
  box-shadow: var(--shadow-card);
}

header {
  position: sticky;
  top: 0;
  z-index: 40;
  background: rgba(2, 19, 16, 0.98);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid rgba(16, 185, 129, 0.2);
  padding: 12px 16px;
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
}

.page { display: none; opacity: 0; transform: translateY(6px); transition: opacity 0.2s ease, transform 0.2s ease; }
.page.active { display: block; opacity: 1; transform: translateY(0); }

/* iPhone-style compact fixed bottom navigation bar */
.ios-nav {
  position: fixed;
  bottom: 12px;
  left: 10px;
  right: 10px;
  max-width: 480px;
  margin: 0 auto;
  z-index: 50;
  background: rgba(2, 19, 16, 0.99);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  border: 1px solid rgba(16, 185, 129, 0.35);
  border-radius: 22px;
  display: flex;
  justify-content: space-around;
  align-items: center;
  padding: 6px 4px;
  box-shadow: 0 16px 40px rgba(0, 0, 0, 0.85);
}

.ios-nav button {
  background: transparent;
  border: 0;
  color: #a7f3d0;
  font-size: 10px;
  font-family: 'Cairo', sans-serif;
  font-weight: 700;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  padding: 6px 2px;
  border-radius: 14px;
  flex: 1;
  transition: all 0.2s ease;
  white-space: nowrap;
}

.ios-nav button span:first-child { font-size: 15px; }

.ios-nav button.active {
  color: #ffffff;
  background: linear-gradient(135deg, #059669 0%, #047857 100%);
  box-shadow: 0 4px 12px rgba(5, 150, 105, 0.4);
}

.mini-player {
  position: fixed;
  bottom: 78px;
  left: 12px;
  right: 12px;
  max-width: 480px;
  margin: 0 auto;
  z-index: 45;
  background: rgba(3, 31, 24, 0.98);
  backdrop-filter: blur(20px);
  border: 1.5px solid rgba(16, 185, 129, 0.45);
  border-radius: 18px;
  padding: 10px 14px;
  display: none;
  box-shadow: 0 16px 36px rgba(0, 0, 0, 0.7);
}

.waves { display: flex; gap: 4px; height: 26px; align-items: center; justify-content: center; }
.waves i { display: block; width: 4px; height: 6px; border-radius: 3px; background: #34d399; }
.waves.playing i { animation: waveAnim 0.4s ease-in-out infinite alternate; }
.waves i:nth-child(1) { animation-delay: 0.0s; }
.waves i:nth-child(2) { animation-delay: 0.12s; }
.waves i:nth-child(3) { animation-delay: 0.24s; }
.waves i:nth-child(4) { animation-delay: 0.08s; }
.waves i:nth-child(5) { animation-delay: 0.2s; }
@keyframes waveAnim { 
  0% { height: 6px; background: #34d399; } 
  100% { height: 24px; background: #6ee7b7; box-shadow: 0 0 12px #34d399; } 
}

/* Rotating disc while text remains 100% completely still and static inside */
.islamic-player-disc {
  width: 190px;
  height: 190px;
  margin: 0 auto 16px;
  border-radius: 50%;
  background: radial-gradient(circle, #059669 0%, #021310 100%);
  position: relative;
  box-shadow: 0 20px 50px rgba(5, 150, 105, 0.3), inset 0 0 30px rgba(255, 255, 255, 0.2);
  border: 4px solid rgba(255, 255, 255, 0.85);
  overflow: hidden;
}

.islamic-player-disc-inner {
  position: absolute;
  inset: 0;
  border-radius: 50%;
}
.islamic-player-disc.spinning .islamic-player-disc-inner {
  animation: discSpin 22s linear infinite;
}
@keyframes discSpin {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

/* Static text container centered securely over the spinning disc */
.islamic-player-static-content {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 5;
  pointer-events: none;
}

.ios-sheet-overlay {
  position: fixed;
  inset: 0;
  background: rgba(2, 19, 16, 0.85);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  z-index: 100;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s ease;
}
.ios-sheet-overlay.active { opacity: 1; pointer-events: auto; }
.ios-sheet {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  z-index: 101;
  background: linear-gradient(180deg, #03221a 0%, #021310 100%);
  border-top: 2px solid rgba(16, 185, 129, 0.45);
  border-radius: 28px 28px 0 0;
  padding: 20px 16px calc(28px + env(safe-area-inset-bottom));
  max-height: 85vh;
  overflow-y: auto;
  transform: translateY(100%);
  transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
}
.ios-sheet-overlay.active .ios-sheet { transform: translateY(0); }
.sheet-handle { width: 40px; height: 5px; background: rgba(16, 185, 129, 0.4); border-radius: 10px; margin: 0 auto 14px; }
</style>
</head>
<body>

<header>
  <div class="max-w-lg mx-auto flex justify-between items-center">
    <div class="flex items-center gap-2.5">
      <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-[#059669] to-[#34d399] flex items-center justify-center text-lg text-white shadow-md font-bold">🕌</div>
      <div>
        <div class="text-lg font-extrabold text-white leading-tight">أَثَر | Athar</div>
        <div class="text-[10px] text-[#34d399] font-bold" id="liveClockDisplay">جاري تحديد الوقت...</div>
      </div>
    </div>
    <button onclick="openBookmarksModal()" class="border border-[#34d399]/40 bg-emerald-950/70 px-3 py-1.5 rounded-2xl text-xs text-white font-bold shadow-sm hover:bg-emerald-900 transition flex items-center gap-1">
      <span>⭐</span> <span>المفضلة</span>
    </button>
  </div>
</header>

<main class="max-w-lg mx-auto p-4 pt-3">

  <section id="home" class="page active">
    <!-- Non-wrapping Date Card -->
    <div class="bg-emerald-950/85 border border-emerald-500/30 rounded-2xl p-3 mb-4 shadow-sm">
      <div class="grid grid-cols-2 gap-2 text-center">
        <div class="border-l border-emerald-500/20 pl-2">
          <span class="text-[10px] text-[#34d399] font-bold block mb-0.5">🌙 الهجري</span>
          <span id="hijriDateDisplay" class="text-xs text-white font-bold truncate block">--</span>
        </div>
        <div>
          <span class="text-[10px] text-[#34d399] font-bold block mb-0.5">☀️ الميلادي</span>
          <span id="gregorianDateDisplay" class="text-xs text-white font-bold truncate block">--</span>
        </div>
      </div>
    </div>

    <!-- Dynamic Period Image & Next Prayer Card -->
    <div class="glass-card text-center py-6 relative overflow-hidden bg-gradient-to-br from-emerald-950/90 via-[#03221a]/85 to-[#021310]/90">
      <div id="prayerBannerBg" class="absolute inset-0 opacity-20 bg-cover bg-center pointer-events-none transition-all duration-700" style="background-image: url('https://placehold.co/600x400/021310/34d399?text=Athar');"></div>
      <div class="relative z-10">
        <div class="flex items-center justify-center gap-1 text-xs text-[#a7f3d0] font-bold mb-1">
          <span>📍</span> <span id="cityNameDisplay">الغردقة وبحر أحمر</span>
          <button onclick="requestUserGPSLocation()" class="mr-2 px-2 py-0.5 bg-[#059669] text-white rounded-xl text-[10px] font-bold shadow">GPS 📍</button>
        </div>
        <div class="text-[11px] text-[#34d399] font-semibold" id="currentPeriodLabel">الصلاة القادمة</div>
        <div class="text-3xl font-black my-1 text-white" id="nextPrayerName">--</div>
        <div class="text-2xl font-extrabold text-[#34d399] mb-1.5 font-mono" id="nextPrayerTime">--:--</div>
        <div class="inline-block px-3.5 py-1 rounded-full bg-[#059669] text-white text-[11px] font-bold shadow-md" id="nextPrayerCountdown">
          جاري الحساب...
        </div>
      </div>
    </div>

    <div class="glass-card">
      <div class="flex justify-between items-center mb-3">
        <h2 class="text-xs font-bold text-white flex items-center gap-1"><span>🕌</span> مواقيت الصلاة بدقة تامة</h2>
        <button onclick="go('settings')" class="text-[11px] text-[#34d399] font-bold">تغيير المدينة ⚙️</button>
      </div>
      <div class="grid grid-cols-3 gap-2" id="prayers"></div>
    </div>

    <div onclick="playLiveRadio()" class="glass-card cursor-pointer bg-gradient-to-r from-emerald-900/90 to-[#03221a]/90 border border-emerald-400/50 p-3.5 flex items-center justify-between hover:scale-[1.01] transition shadow-md mb-4">
      <div class="flex items-center gap-3">
        <div class="w-11 h-11 rounded-2xl bg-emerald-700 text-white flex items-center justify-center text-lg font-bold animate-pulse shadow">📻</div>
        <div>
          <div class="text-xs font-extrabold text-white">إذاعة القرآن الكريم مباشر 🔴</div>
          <div class="text-[10px] text-[#34d399]">بث مباشر على مدار الساعة</div>
        </div>
      </div>
      <span class="text-[11px] font-bold bg-[#059669] text-white px-3 py-1 rounded-xl shadow">استماع ♫</span>
    </div>

    <div class="mb-4">
      <h2 class="text-xs font-bold text-white mb-2 px-1">⚡ خدمات تطبيق أَثَر</h2>
      <div class="grid grid-cols-2 gap-2.5">
        <div onclick="go('quran')" class="glass-card mb-0 cursor-pointer p-3 flex items-center gap-2.5 hover:border-[#34d399] transition">
          <div class="w-10 h-10 rounded-xl bg-emerald-900/70 text-[#34d399] flex items-center justify-center text-lg font-bold border border-emerald-500/35">📖</div>
          <div>
            <h3 class="text-xs font-bold text-white">المصحف الشريف</h3>
            <p class="text-[9px] text-[#a7f3d0]">114 سورة كاملة</p>
          </div>
        </div>
        <div onclick="go('readers')" class="glass-card mb-0 cursor-pointer p-3 flex items-center gap-2.5 hover:border-[#34d399] transition">
          <div class="w-10 h-10 rounded-xl bg-emerald-900/70 text-[#34d399] flex items-center justify-center text-lg font-bold border border-emerald-500/35">🎙️</div>
          <div>
            <h3 class="text-xs font-bold text-white">15 شيخ وقارئ</h3>
            <p class="text-[9px] text-[#a7f3d0]">تلاوات معتمدة</p>
          </div>
        </div>
        <div onclick="go('adhkar')" class="glass-card mb-0 cursor-pointer p-3 flex items-center gap-2.5 hover:border-[#34d399] transition">
          <div class="w-10 h-10 rounded-xl bg-emerald-900/70 text-[#34d399] flex items-center justify-center text-lg font-bold border border-emerald-500/35">📿</div>
          <div>
            <h3 class="text-xs font-bold text-white">السبحة والأحاديث</h3>
            <p class="text-[9px] text-[#a7f3d0]">تسبيح وهدي نبوي</p>
          </div>
        </div>
        <div onclick="go('qibla')" class="glass-card mb-0 cursor-pointer p-3 flex items-center gap-2.5 hover:border-[#34d399] transition">
          <div class="w-10 h-10 rounded-xl bg-emerald-900/70 text-[#34d399] flex items-center justify-center text-lg font-bold border border-emerald-500/35">🧭</div>
          <div>
            <h3 class="text-xs font-bold text-white">اتجاه القبلة</h3>
            <p class="text-[9px] text-[#a7f3d0]">بوصلة الكعبة</p>
          </div>
        </div>
      </div>
    </div>
  </section>

  <section id="quran" class="page">
    <div class="glass-card">
      <div class="flex justify-between items-center mb-2">
        <h2 class="text-sm font-bold text-white">📖 فهرس السور القرآنية</h2>
        <span class="text-[11px] text-[#34d399] font-bold">114 سورة</span>
      </div>
      <p class="text-[11px] text-[#a7f3d0] mb-3">اختر أي سورة للاستماع الفوري بأجمل التلاوات.</p>
      <input id="surahSearch" placeholder="ابحث باسم السورة (مثلاً: البقرة، الكهف...)" oninput="renderSurahs()" class="w-full bg-emerald-950/80 border border-emerald-500/40 text-white placeholder-[#a7f3d0]/60 px-3.5 py-2.5 rounded-2xl text-xs outline-none focus:border-[#34d399] transition mb-3 shadow-sm">
      <div id="quranList" class="space-y-2"></div>
    </div>
  </section>

  <section id="readers" class="page">
    <div class="glass-card">
      <h2 class="text-sm font-bold text-white mb-1">🎙️ 15 شيخاً وقارئاً ومؤذناً</h2>
      <p class="text-[11px] text-[#a7f3d0] mb-3">اختر المقرئ الذي تريد سماع تلاوته، أو حدده كمؤذن رسمي للصلوات.</p>
      <input id="readerSearch" placeholder="ابحث باسم الشيخ..." oninput="renderReaders()" class="w-full bg-emerald-950/80 border border-emerald-500/40 text-white placeholder-[#a7f3d0]/60 px-3.5 py-2.5 rounded-2xl text-xs outline-none focus:border-[#34d399] transition mb-3 shadow-sm">
      <div id="readerList" class="space-y-2"></div>
    </div>
  </section>

  <section id="adhkar" class="page">
    <div class="glass-card text-center py-5">
      <h2 class="text-sm font-bold text-white mb-1">📿 السبحة الرقمية والأحاديث النبوية</h2>
      <p class="text-[11px] text-[#a7f3d0] mb-3.5">اطمئن بذكر الله وتعرف على هدي المصطفى صلى الله عليه وسلم.</p>
      
      <div class="bg-gradient-to-b from-emerald-900/80 to-emerald-950/95 border border-emerald-500/35 rounded-3xl p-4 mb-4 shadow-inner">
        <div class="text-xs text-white font-bold mb-2" id="dhikrTitle">سبحان الله وبحمده، سبحان الله العظيم</div>
        <div class="text-4xl font-black text-[#34d399] my-2 font-mono tracking-wider" id="tasbihCount">0</div>
        <div class="flex justify-center gap-2">
          <button onclick="incrementTasbih()" class="w-32 py-2.5 rounded-2xl bg-gradient-to-r from-[#059669] to-[#047857] text-white font-bold text-xs shadow-lg hover:scale-105 active:scale-95 transition">
            تسبيح +1
          </button>
          <button onclick="resetTasbih()" class="px-3.5 py-2.5 rounded-2xl bg-emerald-900/70 text-white text-xs font-bold border border-emerald-500/30">
            إعادة
          </button>
        </div>
      </div>

      <div class="bg-emerald-950/85 border border-emerald-500/35 p-3.5 rounded-2xl mb-3 text-right shadow-sm">
        <div class="flex justify-between items-center mb-1.5">
          <span class="text-[11px] font-bold text-[#34d399]">📜 من هدي السنة النبوية الشريفة</span>
          <button onclick="nextHadith()" class="text-[10px] bg-emerald-900 text-white px-2 py-0.5 rounded-xl border border-emerald-500/30">حديث آخر ⟳</button>
        </div>
        <p id="hadithText" class="text-xs text-white leading-relaxed font-semibold">«إنما الأعمال بالنيات، وإنما لكل امرئ ما نوى...»</p>
        <span id="hadithSource" class="text-[10px] text-[#a7f3d0] mt-1 block">رواه البخاري ومسلم</span>
      </div>

      <div class="grid grid-cols-2 gap-2 mb-3">
        <button onclick="setDhikr('سبحان الله وبحمده، سبحان الله العظيم')" class="bg-emerald-950/70 border border-emerald-500/30 p-2.5 rounded-2xl text-xs text-right shadow-sm">
          <b class="text-white block">سبحان الله وبحمده</b>
          <span class="text-[9px] text-[#a7f3d0]">تغرس لك نخلة في الجنة</span>
        </button>
        <button onclick="setDhikr('لا حول ولا قوة إلا بالله')" class="bg-emerald-950/70 border border-emerald-500/30 p-2.5 rounded-2xl text-xs text-right shadow-sm">
          <b class="text-white block">لا حول ولا قوة إلا بالله</b>
          <span class="text-[9px] text-[#a7f3d0]">كنز من كنز الجنة</span>
        </button>
      </div>

      <div class="space-y-2 text-right">
        <div onclick="openAdhkarCategory('أذكار الصباح')" class="bg-emerald-950/70 border border-emerald-500/30 p-2.5 rounded-2xl cursor-pointer flex justify-between items-center shadow-sm">
          <div>
            <b class="text-xs text-white">☀️ أذكار الصباح</b>
            <p class="text-[9px] text-[#a7f3d0]">حصن المسلم لصباحه</p>
          </div>
          <span class="text-xs text-[#34d399] font-bold">عرض ↗</span>
        </div>
        <div onclick="openAdhkarCategory('أذكار المساء')" class="bg-emerald-950/70 border border-emerald-500/30 p-2.5 rounded-2xl cursor-pointer flex justify-between items-center shadow-sm">
          <div>
            <b class="text-xs text-white">🌙 أذكار المساء</b>
            <p class="text-[9px] text-[#a7f3d0]">حصن المسلم لمسائه</p>
          </div>
          <span class="text-xs text-[#34d399] font-bold">عرض ↗</span>
        </div>
      </div>
    </div>
  </section>

  <section id="qibla" class="page">
    <div class="glass-card text-center py-6">
      <h2 class="text-sm font-bold text-white mb-1">🧭 تحديد اتجاه القبلة</h2>
      <p class="text-[11px] text-[#a7f3d0] mb-4">اتجاه الكعبة المشرفة بدقة لموقعك الحالي.</p>
      
      <div class="relative w-48 h-48 mx-auto mb-4 flex items-center justify-center bg-emerald-950/90 rounded-full border-4 border-emerald-500/50 shadow-xl">
        <div class="absolute inset-3 rounded-full border border-dashed border-emerald-500/40"></div>
        <div id="compassNeedle" class="absolute w-2 h-28 bg-gradient-to-t from-transparent via-[#34d399] to-red-500 rounded-full" style="transform: rotate(136deg);"></div>
        <div class="w-10 h-10 rounded-full bg-[#059669] border-2 border-white flex items-center justify-center text-base text-white shadow-md z-10 font-bold">🕋</div>
      </div>

      <div class="bg-emerald-950/70 border border-emerald-500/30 p-3 rounded-2xl text-xs text-center shadow-sm">
        <div class="text-white font-bold">زاوية القبلة: 136.4° شمالاً شرقيًا</div>
        <p class="text-[10px] text-[#a7f3d0] mt-0.5">تم الحساب بدقة حسب الإحداثيات الجغرافية.</p>
      </div>
    </div>
  </section>

  <section id="player" class="page">
    <div class="glass-card text-center py-6 relative overflow-hidden">
      <div class="flex justify-between items-center mb-3">
        <span class="text-[10px] text-white font-bold bg-emerald-900/80 px-3 py-1 rounded-full border border-emerald-500/35" id="playerBadge">✨ مشغل الصوتيات</span>
        <button onclick="toggleBookmarkCurrent()" id="bookmarkBtn" class="text-xs text-[#34d399] hover:underline font-bold">⭐ حفظ في المفضلة</button>
      </div>

      <!-- Rotating Disc with 100% static still text inside -->
      <div class="islamic-player-disc" id="playerDisc">
        <div class="islamic-player-disc-inner"></div>
        <div class="islamic-player-static-content">
          <div class="w-12 h-12 rounded-full bg-white/20 border border-white/50 flex items-center justify-center text-lg mb-1 text-white shadow-inner" id="playerDiscIcon">🌙</div>
          <div class="text-white font-black text-xs px-3 text-center" id="playingSurahName">سورة الفاتحة</div>
          <div class="text-[10px] text-[#a7f3d0] font-semibold mt-0.5" id="playingDiscSub">تلاوة عذبة مباركة</div>
        </div>
      </div>

      <h3 id="playingReaderName" class="text-xs font-bold text-white mb-0.5">محمود خليل الحصري</h3>
      <p class="text-[11px] text-[#34d399] font-bold mb-3" id="playingReaderDesc">رواية حفص عن عاصم</p>
      
      <!-- Active animated Equalizer Waves surrounding the audio controls -->
      <div class="waves mb-4" id="waves">
        <i></i><i></i><i></i><i></i><i></i>
